<!DOCTYPE html>
<html>
<head>
	<title> </title>
	<link rel="stylesheet" href="/css/main.css" />
</head>
<body>
	<main>
		<div class="chat-wrapper">
			<div class="chat__top">
				<p class="chat-header"> Chat App </p>
				<hr />
			</div>
			<div class="chat__middle" id="message-window">
				<div class="message-placeholder"></div>
			</div>
			<div class="chat__bottom">
				<button id="send-location-btn">share location</button>
				<form class="chat-form" id="message-form" autocomplete="off" >
					<input name="messageInput" placeholder="msg" required="true"/>
					<button> send </button>
				</form>
			</div>
		</div>
			
		<div class="chat-nav">
			<div class="room-info"></div>
			<div class="more-room"></div>
		</div>
	</main>
	
	
	<!-- templates -->
	<script id="message-template" type="text/html">
		<div>
			<p> 
				{{owner}}
				<span class="message-time">{{createdAt}}</span> <br />
				{{message}}
			</p>
		</div>
	</script>
	<script id="location-message-template" type="text/html">
		<div>
			<p>
				{{owner}}
				<span class="message-time">{{createdAt}}</span> <br /> 
				<a href="{{url}}" target="_blank">shared location!</a>
			</p>
		</div>
	</script>
	<script id="room-info-template" type="text/html">
		<h2 class="room-title">{{room}}</h2>
		<ul class="room-users">
			{{#users}}
				<li>{{username}}</li>
			{{/users}}
		</ul>
	</script>
	
	<!-- scripts -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/mustache.js/3.0.1/mustache.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.22.2/moment.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/qs/6.6.0/qs.min.js"></script>
	<script src="/socket.io/socket.io.js"></script>
	<script src="/js/chat.js"></script>
</body>
</html>
